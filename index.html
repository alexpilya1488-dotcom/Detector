const DICT = {};
DICT_SRC.trim().split("\n").forEach(line => {
  const p = line.split("|");
  DICT[p[0]] = Object.fromEntries(ORDER.map((c, i) => [c, p[i + 1]]));
});

const $ = id => document.getElementById(id);
const l1 = $("l1"), l2 = $("l2"), statusEl = $("status"), video = $("v");
for (const sel of [l1, l2]) LANGS.forEach(([n, c]) => sel.add(new Option(n, c)));
l1.value = localStorage.getItem("l1") || "ru";
l2.value = localStorage.getItem("l2") || "en";
for (const sel of [l1, l2]) sel.onchange = () => {
  localStorage.setItem("l1", l1.value);
  localStorage.setItem("l2", l2.value);
};

// Названия вне словаря переводятся онлайн (и запоминаются)
const online = new Map(), pending = new Set();
function label(cls, lang) {
  if (lang === "en") return cls;
  if (DICT[cls] && DICT[cls][lang]) return DICT[cls][lang];
  const key = lang + "|" + cls;
  if (online.has(key)) return online.get(key);
  if (!pending.has(key)) {
    pending.add(key);
    fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(cls) + "&langpair=en|" + lang)
      .then(r => r.json()).then(j => online.set(key, j.responseData.translatedText || cls))
      .catch(() => online.set(key, cls));
  }
  return cls;
}

const canvas = $("ov"), ctx = canvas.getContext("2d");
function resize() {
  const d = window.devicePixelRatio || 1;
  canvas.width = innerWidth * d; canvas.height = innerHeight * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener("resize", resize); resize();

function draw(preds) {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(innerWidth / vw, innerHeight / vh);
  const offX = (vw * scale - innerWidth) / 2, offY = (vh * scale - innerHeight) / 2;
  ctx.font = "bold 18px system-ui, sans-serif";
  ctx.textBaseline = "middle";
  for (const p of preds) {
    const x = p.bbox[0] * scale - offX, y = p.bbox[1] * scale - offY;
    const w = p.bbox[2] * scale, h = p.bbox[3] * scale;
    ctx.strokeStyle = "#ffd54f"; ctx.lineWidth = 3;
    ctx.strokeRect(x, y, w, h);

    const a = label(p.class, l1.value), b = label(p.class, l2.value);
    const lines = a === b ? [a] : [a, b];
    const tw = Math.max(...lines.map(t => ctx.measureText(t).width)) + 14;
    const th = lines.length * 24 + 6;
    const ty = y - th >= 0 ? y - th : y;
    const tx = Math.min(Math.max(0, x), innerWidth - tw);
    ctx.fillStyle = "rgba(0,0,0,.75)"; ctx.fillRect(tx, ty, tw, th);
    lines.forEach((t, i) => {
      ctx.fillStyle = i ? "#ffd54f" : "#fff";
      ctx.fillText(t, tx + 7, ty + 15 + i * 24);
    });
  }
}

async function main() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }, audio: false
    });
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    statusEl.textContent = "Нет доступа к камере (нужен https и разрешение)";
    return;
  }
  const model = await cocoSsd.load({ base: "lite_mobilenet_v2" });
  statusEl.textContent = "Наведите камеру на предметы";
  (async function loop() {
    if (video.readyState >= 2) draw(await model.detect(video, 10, 0.5));
    requestAnimationFrame(loop);
  })();
}
main();
</script>
